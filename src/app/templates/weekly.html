{% extends "base.html" %}
{% block title %}Weekly glucose — CGM Tracker{% endblock %}
{% block content %}
<h1>Weekly glucose overview</h1>

<div class="card">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.75rem; flex-wrap:wrap; gap:0.5rem;">
    <div style="font-size:0.85rem; color:#666">
      Seven days overlaid on a single 24-hour axis — click a day in the legend to isolate it.
    </div>
    <div style="display:flex; align-items:center; gap:0.5rem;">
      <button id="cgm-prev" class="btn btn-sm" style="background:#f0f0f8; color:#1a1a2e; padding:0.25rem 0.7rem; font-size:1rem;">&#8592;</button>
      <span id="cgm-week-label" style="font-size:0.88rem; color:#555; min-width:160px; text-align:center;">Loading…</span>
      <button id="cgm-next" class="btn btn-sm" style="background:#f0f0f8; color:#1a1a2e; padding:0.25rem 0.7rem; font-size:1rem;" disabled>&#8594;</button>
    </div>
  </div>

  <canvas id="weeklyCgmChart" height="110"></canvas>

  <div id="cgm-lock-pill" style="display:none; margin-top:0.6rem; font-size:0.8rem; color:#555;">
    <span style="background:#e8eaf6; border-radius:12px; padding:0.2rem 0.7rem; display:inline-flex; align-items:center; gap:0.4rem;">
      <span>&#128204;</span>
      <span id="cgm-lock-label"></span>
      <span id="cgm-lock-dismiss" style="cursor:pointer; font-weight:700; color:#888; padding-left:0.2rem;">&#10005;</span>
    </span>
    <span style="margin-left:0.5rem; color:#aaa;">click legend again or ✕ to unlock</span>
  </div>
</div>

<script>
(function () {
  const COLORS = ['#1565C0','#00897B','#2E7D32','#F9A825','#E65100','#6A1B9A','#C62828'];

  let weekOffset = 0;
  let lockedDay  = null;
  let hoveredDay = null;
  let chart      = null;
  let weekData   = null;

  function fracToLabel(t) {
    const h = Math.floor(t), m = Math.round((t - h) * 60);
    const ampm = h >= 12 ? 'PM' : 'AM';
    const h12  = h % 12 || 12;
    return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
  }

  function updateMarkers() {
    if (!chart) return;
    for (let i = 0; i < 7; i++) {
      const ds  = chart.data.datasets[i];
      const day = weekData ? weekData.days[i] : null;
      if (lockedDay === null) {
        ds.borderColor = day && day.is_future ? '#ddd' : COLORS[i];
        ds.borderWidth = day && day.is_today  ? 2.5   : 1.5;
      } else if (i === lockedDay) {
        ds.borderColor = day && day.is_future ? '#aaa' : COLORS[i];
        ds.borderWidth = 2.5;
      } else {
        ds.borderColor = '#d0d0d0';
        ds.borderWidth = 1;
      }
    }
    for (let i = 0; i < 7; i++) {
      const show = (lockedDay === i || hoveredDay === i);
      chart.data.datasets[7  + i].pointRadius = show ? 9 : 0;
      chart.data.datasets[14 + i].pointRadius = show ? 8 : 0;
    }
    chart.update('none');
    const pill  = document.getElementById('cgm-lock-pill');
    const label = document.getElementById('cgm-lock-label');
    if (lockedDay !== null && weekData) {
      label.textContent = weekData.days[lockedDay].label;
      pill.style.display = '';
    } else {
      pill.style.display = 'none';
    }
  }

  function buildChart(data) {
    weekData = data;
    document.getElementById('cgm-week-label').textContent = data.week_label;
    document.getElementById('cgm-prev').disabled = (data.week_offset <= -52);
    document.getElementById('cgm-next').disabled = (data.week_offset >= 0);

    const datasets = [];

    // 7 CGM line datasets (0-6)
    data.days.forEach((day, i) => {
      datasets.push({
        label:           day.label,
        data:            day.cgm.map(p => ({ x: p.t, y: p.g })),
        borderColor:     day.is_future ? '#ddd' : COLORS[i],
        backgroundColor: 'transparent',
        borderWidth:     day.is_today ? 2.5 : 1.5,
        borderDash:      day.is_future ? [4, 4] : [],
        pointRadius:     0,
        tension:         0.3,
        type:            'line',
        order:           day.is_today ? 0 : 1,
      });
    });

    // 7 meal scatter datasets (7-13)
    data.days.forEach((day, i) => {
      datasets.push({
        label:           `__meals_${i}`,
        data:            day.meals.map(m => ({ x: m.t, y: m.g, meta: m })),
        type:            'scatter',
        pointStyle:      'triangle',
        pointRadius:     0,
        backgroundColor: COLORS[i],
        borderColor:     '#fff',
        borderWidth:     1.5,
        order:           -1,
      });
    });

    // 7 activity scatter datasets (14-20)
    data.days.forEach((day, i) => {
      datasets.push({
        label:           `__acts_${i}`,
        data:            day.activities.map(a => ({ x: a.t, y: a.g, meta: a })),
        type:            'scatter',
        pointStyle:      'circle',
        pointRadius:     0,
        backgroundColor: COLORS[i],
        borderColor:     '#fff',
        borderWidth:     2,
        order:           -1,
      });
    });

    // Reference lines (21, 22)
    datasets.push({
      label: '__ref180',
      data:  [{ x: 0, y: 180 }, { x: 24, y: 180 }],
      type:  'line',
      borderColor: '#E65100',
      borderWidth: 1,
      borderDash:  [5, 4],
      pointRadius: 0,
      fill: false,
      order: 2,
    });
    datasets.push({
      label: '__ref70',
      data:  [{ x: 0, y: 70 }, { x: 24, y: 70 }],
      type:  'line',
      borderColor: '#c62828',
      borderWidth: 1,
      borderDash:  [5, 4],
      pointRadius: 0,
      fill: false,
      order: 2,
    });

    if (chart) { chart.destroy(); chart = null; }
    lockedDay  = null;
    hoveredDay = null;

    const ctx = document.getElementById('weeklyCgmChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'scatter',
      data: { datasets },
      options: {
        animation: false,
        interaction: { mode: 'nearest', axis: 'x', intersect: false },
        onHover: (event, activeElements) => {
          if (!activeElements.length) {
            if (hoveredDay !== null) { hoveredDay = null; updateMarkers(); }
            return;
          }
          const dsIdx = activeElements[0].datasetIndex;
          if (dsIdx < 7) {
            if (hoveredDay !== dsIdx) { hoveredDay = dsIdx; updateMarkers(); }
          }
        },
        plugins: {
          legend: {
            position: 'bottom',
            labels: {
              filter: item => !item.text.startsWith('__'),
              usePointStyle: true,
              pointStyle: 'line',
              boxWidth: 30,
              padding: 14,
              font: { size: 12 },
            },
            onClick: (e, legendItem) => {
              const i = legendItem.datasetIndex;
              if (i >= 7) return;
              lockedDay = (lockedDay === i) ? null : i;
              updateMarkers();
            },
            onHover: (e, legendItem) => {
              if (legendItem.datasetIndex < 7) {
                hoveredDay = legendItem.datasetIndex;
                updateMarkers();
              }
            },
            onLeave: () => { hoveredDay = null; updateMarkers(); },
          },
          tooltip: {
            callbacks: {
              title(items) {
                const item = items[0];
                const i    = item.datasetIndex;
                if (i < 7) return `${weekData.days[i].label}  ·  ${fracToLabel(item.parsed.x)}`;
                if (i >= 7 && i < 14) return `${weekData.days[i-7].label}  ·  ${fracToLabel(item.raw.meta.t)}`;
                if (i >= 14 && i < 21) return `${weekData.days[i-14].label}  ·  ${fracToLabel(item.raw.meta.t)}`;
                return '';
              },
              label(item) {
                const i = item.datasetIndex;
                if (i < 7) {
                  const g    = Math.round(item.parsed.y);
                  const lines = [`${g} mg/dL`];
                  const t    = item.parsed.x;
                  const day  = weekData.days[i];
                  day.meals.forEach(m => {
                    if (Math.abs(m.t - t) <= 0.25)
                      lines.push(`🍽  ${m.name}${m.carbs ? '  ' + m.carbs + 'g' : ''}`);
                  });
                  day.activities.forEach(a => {
                    if (Math.abs(a.t - t) <= 0.25)
                      lines.push(`🚶  ${a.type}  ${a.duration} min`);
                  });
                  return lines;
                }
                if (i >= 7 && i < 14) {
                  const m = item.raw.meta;
                  return `🍽  ${m.name}${m.carbs ? '  ' + m.carbs + 'g carbs' : ''}`;
                }
                if (i >= 14 && i < 21) {
                  const a = item.raw.meta;
                  return `🚶  ${a.type}  ·  ${a.duration} min`;
                }
                return '';
              },
            }
          },
        },
        scales: {
          x: {
            type: 'linear',
            min: 0, max: 24,
            ticks: {
              stepSize: 3,
              callback: v => {
                if (v === 0 || v === 24) return '12am';
                if (v === 12) return '12pm';
                return v < 12 ? `${v}am` : `${v - 12}pm`;
              },
              font: { size: 11 },
            },
            grid: { color: '#f0f0f0' },
          },
          y: {
            title: { display: true, text: 'Glucose (mg/dL)', font: { size: 11 } },
            min: 50,
            ticks: { font: { size: 11 } },
            grid: { color: '#f0f0f0' },
          },
        },
      },
    });

    updateMarkers();
  }

  function loadWeek(offset) {
    weekOffset = offset;
    document.getElementById('cgm-week-label').textContent = 'Loading…';
    fetch(`/weekly/data?week_offset=${offset}`)
      .then(r => r.json())
      .then(buildChart)
      .catch(() => {
        document.getElementById('cgm-week-label').textContent = 'Failed to load';
      });
  }

  document.getElementById('cgm-prev').addEventListener('click', () => loadWeek(weekOffset - 1));
  document.getElementById('cgm-next').addEventListener('click', () => loadWeek(weekOffset + 1));
  document.getElementById('cgm-lock-dismiss').addEventListener('click', () => {
    lockedDay = null;
    updateMarkers();
  });

  loadWeek(0);
})();
</script>
{% endblock %}
